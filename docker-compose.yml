version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sigep-postgres
    environment:
      POSTGRES_DB: sigep_db
      POSTGRES_USER: sigep_user
      POSTGRES_PASSWORD: sigep_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup-database.sql:/docker-entrypoint-initdb.d/setup.sql
    networks:
      - sigep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigep_user -d sigep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sigep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sigep-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sigep-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sigep.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - sigep-network
    depends_on:
      - postgres

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sigep-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - sigep-network
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:

networks:
  sigep-network:
    driver: bridge

