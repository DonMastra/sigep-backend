services:
  - type: web
    name: sigep-backend-qa
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: qa
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: JPA_DDL_AUTO
        value: validate
      - key: CACHE_NAMESPACE
        value: sigep-qa
      - key: APP_PUBLIC_REGISTRATION_ENABLED
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://sigep.com.ar,https://www.sigep.com.ar,https://sigep-ui-xi.vercel.app,https://sigep-qa.vercel.app
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      # QA-only fiscal simulation. Production profiles reject this provider.
      - key: BILLING_FISCAL_PROVIDER
        value: mock
      - key: BILLING_OUTBOX_ENABLED
        value: true
      # Configure these values in Render so generated demo documents are complete.
      - key: BILLING_ISSUER_CUIT
        sync: false
      - key: BILLING_ISSUER_POINT_OF_SALE
        sync: false
      - key: BILLING_ISSUER_LEGAL_NAME
        sync: false
      - key: BILLING_ISSUER_BUSINESS_ADDRESS
        sync: false
      - key: BILLING_ISSUER_VAT_CONDITION
        sync: false
      - key: BILLING_ISSUER_GROSS_INCOME
        sync: false
      - key: BILLING_ISSUER_ACTIVITY_START
        sync: false
