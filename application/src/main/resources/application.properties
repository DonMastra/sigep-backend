# Application Configuration
spring.application.name=sigep-backend
server.port=8080
server.servlet.context-path=/
sigep.version=1.0.0

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sigep_db
spring.datasource.username=sigep_user
spring.datasource.password=sigep_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationShouldBeAtLeast256BitsLongForHS512Algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,https://sigep.edu.mx

# Security Configuration
app.security.rate-limit.enabled=true
app.security.rate-limit.capacity=100
app.security.rate-limit.refill-tokens=100
app.security.rate-limit.refill-duration-minutes=1

# Session Configuration
spring.session.timeout=30m
server.servlet.session.timeout=30m

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sigep=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://sigep.edu.mx
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# API Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

