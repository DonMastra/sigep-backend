# Production Environment Configuration

spring:
  # PostgreSQL Configuration (use environment variables in production)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sigep_db}
    username: ${DATABASE_USERNAME:sigep_user}
    password: ${DATABASE_PASSWORD:sigep_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate Configuration (never use ddl-auto=update in production!)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # Redis Configuration (use environment variables)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Server Configuration
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

# JWT Configuration (use environment variables)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

# CORS Configuration (restrict to production domains)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sigep.edu.mx,https://www.sigep.edu.mx}
  security:
    rate-limit:
      capacity: 100
      refill-tokens: 100

# Actuator (expose only health and info in production)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration (less verbose in production)
logging:
  level:
    root: WARN
    com.sigep: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

