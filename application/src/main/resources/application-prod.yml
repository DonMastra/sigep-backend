# Production Environment Configuration

spring:
  # PostgreSQL Configuration (use environment variables in production)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sigep_db}
    username: ${DATABASE_USERNAME:sigep_user}
    password: ${DATABASE_PASSWORD:sigep_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate Configuration (never use ddl-auto=update in production!)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # Redis Configuration (use environment variables)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Server Configuration
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

# JWT Configuration (use environment variables)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

# CORS Configuration (restrict to production domains)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sigep.edu.mx,https://www.sigep.edu.mx}
  security:
    rate-limit:
      capacity: 100
      refill-tokens: 100

# Actuator (expose only health and info in production)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration (less verbose in production)
logging:
  level:
    root: WARN
    com.sigep: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

billing:
  fiscal-exclusion:
    enabled: ${BILLING_FISCAL_EXCLUSION_ENABLED:false}
  automatic-debit:
    provider: ${BILLING_AUTOMATIC_DEBIT_PROVIDER:disabled}
  late-fee:
    cron: ${BILLING_LATE_FEE_CRON:0 15 1 * * *}
  fiscal:
    provider: ${BILLING_FISCAL_PROVIDER:disabled}
    reference-data-cache-ttl: ${BILLING_FISCAL_REFERENCE_DATA_CACHE_TTL:6h}
    reference-data-stale-if-error: ${BILLING_FISCAL_REFERENCE_DATA_STALE_IF_ERROR:24h}
    resilience:
      max-concurrent-calls: ${BILLING_FISCAL_MAX_CONCURRENT_CALLS:4}
      max-wait-duration: ${BILLING_FISCAL_MAX_WAIT_DURATION:0s}
      failure-rate-threshold: ${BILLING_FISCAL_FAILURE_RATE_THRESHOLD:50}
      minimum-number-of-calls: ${BILLING_FISCAL_MINIMUM_NUMBER_OF_CALLS:5}
      sliding-window-size: ${BILLING_FISCAL_SLIDING_WINDOW_SIZE:10}
      permitted-calls-in-half-open-state: ${BILLING_FISCAL_HALF_OPEN_CALLS:2}
      open-state-duration: ${BILLING_FISCAL_OPEN_STATE_DURATION:30s}
  issuer:
    cuit: ${BILLING_ISSUER_CUIT:}
    point-of-sale: ${BILLING_ISSUER_POINT_OF_SALE:}
    legal-name: ${BILLING_ISSUER_LEGAL_NAME:}
    business-address: ${BILLING_ISSUER_BUSINESS_ADDRESS:}
    vat-condition: ${BILLING_ISSUER_VAT_CONDITION:}
    gross-income: ${BILLING_ISSUER_GROSS_INCOME:}
    activity-start: ${BILLING_ISSUER_ACTIVITY_START:}
  arca:
    environment: production
    wsaa-url: ${BILLING_ARCA_WSAA_URL:https://wsaa.afip.gov.ar/ws/services/LoginCms}
    wsfe-url: ${BILLING_ARCA_WSFE_URL:https://servicios1.afip.gov.ar/wsfev1/service.asmx}
    keystore:
      path: ${BILLING_ARCA_KEYSTORE_PATH:}
      password: ${BILLING_ARCA_KEYSTORE_PASSWORD:}
      alias: ${BILLING_ARCA_KEYSTORE_ALIAS:}
    connect-timeout: ${BILLING_ARCA_CONNECT_TIMEOUT:5s}
    request-timeout: ${BILLING_ARCA_REQUEST_TIMEOUT:20s}
    ticket-refresh-skew: ${BILLING_ARCA_TICKET_REFRESH_SKEW:5m}
  mock-service:
    base-url: ${BILLING_MOCK_SERVICE_BASE_URL:http://localhost:8091}
    connect-timeout: ${BILLING_MOCK_SERVICE_CONNECT_TIMEOUT:2s}
    request-timeout: ${BILLING_MOCK_SERVICE_REQUEST_TIMEOUT:5s}
  outbox:
    poll-delay-ms: ${BILLING_OUTBOX_POLL_DELAY_MS:1000}

